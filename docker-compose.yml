services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-central_alertas}
      MYSQL_USER: ${MYSQL_USER:-alertas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dispatch_internal

  dispatch:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-alertas}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-central_alertas}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      LOCAL_AUTH_BOOTSTRAP_USERNAME: ${LOCAL_AUTH_BOOTSTRAP_USERNAME:?LOCAL_AUTH_BOOTSTRAP_USERNAME is required}
      LOCAL_AUTH_BOOTSTRAP_PASSWORD: ${LOCAL_AUTH_BOOTSTRAP_PASSWORD:?LOCAL_AUTH_BOOTSTRAP_PASSWORD is required}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALRT_INGRESS_MODE: ${ALRT_INGRESS_MODE:-desativado}
      ALRT_INGRESS_API_KEY: ${ALRT_INGRESS_API_KEY:-}
      ALRT_INGRESS_HMAC_SECRET: ${ALRT_INGRESS_HMAC_SECRET:-}
      ALRT_TIMESTAMP_TOLERANCE_SECONDS: ${ALRT_TIMESTAMP_TOLERANCE_SECONDS:-300}
      ALRT_RATE_LIMIT: ${ALRT_RATE_LIMIT:-60}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - dispatch_internal

volumes:
  mysql_data:

networks:
  dispatch_internal:
    driver: bridge
