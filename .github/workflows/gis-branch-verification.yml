name: GIS branch verification

on:
  push:
    branches:
      - roadmap/d005-gis-open-source
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- client/src/components/LeafletOperationalMap.test.ts
      - run: pnpm check
      - run: pnpm build
