name: D-008 Test Diagnostic Temp

on:
  push:
    branches: [feature/d008-no-code-forms]

permissions:
  contents: read

env:
  CI: true

jobs:
  unit-tests:
    name: D-008 unit test diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Habilitar Corepack
        run: corepack enable
      - name: Instalar dependências congeladas
        run: corepack pnpm install --frozen-lockfile
      - name: Executar testes e capturar saída
        shell: bash
        run: |
          set +e
          corepack pnpm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > test-exit-code.txt
          exit 0
      - name: Publicar diagnóstico
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d008-test-diagnostic
          path: |
            test-output.txt
            test-exit-code.txt
          if-no-files-found: error
