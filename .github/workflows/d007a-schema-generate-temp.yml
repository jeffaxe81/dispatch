name: D-007A schema generate TEMP

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: d007a-schema-generate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate migration without applying database changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      DATABASE_URL: mysql://root:plan-only@127.0.0.1:3306/dispatch_plan

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências congeladas
        run: corepack pnpm install --frozen-lockfile

      - name: Gerar migration D-007A sem aplicar banco
        run: corepack pnpm exec drizzle-kit generate --name d007a_work_shift_history

      - name: Listar evidência gerada
        run: |
          ls -la drizzle/0003*
          ls -la drizzle/meta/0003_snapshot.json drizzle/meta/_journal.json

      - name: Publicar migration e metadata geradas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: d007a-generated-drizzle
          path: |
            drizzle/0003_*.sql
            drizzle/meta/0003_snapshot.json
            drizzle/meta/_journal.json
          if-no-files-found: error
          retention-days: 3
