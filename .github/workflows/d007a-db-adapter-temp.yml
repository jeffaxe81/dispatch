name: D-007A db adapter TEMP

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: d007a-router-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Normalize and validate work shift router formatting
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: true

    steps:
      - name: Obter branch da feature
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências congeladas
        run: corepack pnpm install --frozen-lockfile

      - name: Corrigir somente a indentação do bloco workShifts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("server/routers.ts")
          source = path.read_text()
          old = '''  workShifts: router({
          current: operationalProcedure.query(async ({ ctx }) => {
            await assertPermission(ctx.user, "work_shifts.view");
            return getOwnCurrentWorkShift(ctx.user.id);
          }),
          history: operationalProcedure.input(paginationInput).query(async ({ ctx, input }) => {
            await assertPermission(ctx.user, "work_shifts.view");
            return listOwnWorkShiftHistory({ userId: ctx.user.id, ...input });
          }),
          control: operationalProcedure
            .input(z.object({ action: z.enum(WORK_SHIFT_ACTIONS) }))
            .mutation(async ({ ctx, input }) => {
              await assertPermission(ctx.user, "work_shifts.control");
              return controlOwnWorkShift({
                userId: ctx.user.id,
                teamId: ctx.user.teamId,
                action: input.action,
              });
            }),
        }),
          '''
          new = '''  workShifts: router({
            current: operationalProcedure.query(async ({ ctx }) => {
              await assertPermission(ctx.user, "work_shifts.view");
              return getOwnCurrentWorkShift(ctx.user.id);
            }),
            history: operationalProcedure.input(paginationInput).query(async ({ ctx, input }) => {
              await assertPermission(ctx.user, "work_shifts.view");
              return listOwnWorkShiftHistory({ userId: ctx.user.id, ...input });
            }),
            control: operationalProcedure
              .input(z.object({ action: z.enum(WORK_SHIFT_ACTIONS) }))
              .mutation(async ({ ctx, input }) => {
                await assertPermission(ctx.user, "work_shifts.control");
                return controlOwnWorkShift({
                  userId: ctx.user.id,
                  teamId: ctx.user.teamId,
                  action: input.action,
                });
              }),
          }),
          '''
          if source.count(old) != 1:
              raise SystemExit("Bloco workShifts inesperado; não aplicar formatação automática.")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Validar contrato direcionado
        run: |
          corepack pnpm check
          corepack pnpm vitest run --config vitest.config.ts \
            server/workShifts.router.test.ts \
            server/workShiftDbContract.test.ts \
            server/triageAndShift.router.test.ts

      - name: Validar superfície e versionar
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "server/routers.ts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers.ts
          git commit -m "style(d007): align work shift router formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
