name: D-007A db adapter TEMP

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: d007a-db-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Patch and validate transactional work shift adapter
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: true

    steps:
      - name: Obter branch da feature
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências congeladas
        run: corepack pnpm install --frozen-lockfile

      - name: Aplicar patch D-007A por marcadores exatos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("server/db.ts")
          source = path.read_text()
          if "export async function controlOwnWorkShift" in source:
              print("Adapter D-007A já presente; nenhum patch necessário.")
              raise SystemExit(0)

          schema_marker = '} from "../drizzle/schema";\nimport type { IncidentPriority, IncidentStatus, OperationalRole } from "../shared/operations";'
          schema_replacement = '} from "../drizzle/schema";\nimport { workShiftEvents, workShiftSessions } from "../drizzle/workShiftSchema";\nimport type { IncidentPriority, IncidentStatus, OperationalRole } from "../shared/operations";\nimport type { WorkShiftAction } from "../shared/workShifts";'
          if source.count(schema_marker) != 1:
              raise SystemExit("Marcador de imports Drizzle inesperado.")
          source = source.replace(schema_marker, schema_replacement, 1)

          storage_marker = 'import { storageGet, storagePut } from "./storage";\n'
          storage_replacement = 'import { storageGet, storagePut } from "./storage";\nimport { executeOwnWorkShiftAction, type WorkShiftStore } from "./workShiftService";\n'
          if source.count(storage_marker) != 1:
              raise SystemExit("Marcador de import do serviço inesperado.")
          source = source.replace(storage_marker, storage_replacement, 1)

          insert_marker = 'export type TeamShiftAction = "start" | "pause" | "resume" | "end";'
          if source.count(insert_marker) != 1:
              raise SystemExit("Marcador da jornada legada inesperado.")

          block = r'''export async function getOwnCurrentWorkShift(userId: number) {
            const db = await requireDb();
            return (
              await db
                .select()
                .from(workShiftSessions)
                .where(and(eq(workShiftSessions.userId, userId), inArray(workShiftSessions.status, ["active", "paused"])))
                .orderBy(desc(workShiftSessions.startedAt))
                .limit(1)
            )[0] ?? null;
          }

          export async function listOwnWorkShiftHistory(input: { userId: number; page: number; pageSize: number }) {
            const db = await requireDb();
            const where = eq(workShiftSessions.userId, input.userId);
            const [rows, totalRows] = await Promise.all([
              db
                .select()
                .from(workShiftSessions)
                .where(where)
                .orderBy(desc(workShiftSessions.startedAt))
                .limit(input.pageSize)
                .offset((input.page - 1) * input.pageSize),
              db.select({ total: count() }).from(workShiftSessions).where(where),
            ]);
            return { rows, total: Number(totalRows[0]?.total ?? 0) };
          }

          export async function controlOwnWorkShift(input: {
            userId: number;
            teamId: number | null;
            action: WorkShiftAction;
          }) {
            const db = await requireDb();
            return db.transaction(async tx => {
              const lockedUser = await tx
                .select({ id: users.id })
                .from(users)
                .where(eq(users.id, input.userId))
                .limit(1)
                .for("update");
              if (!lockedUser[0]) throw new Error("Usuário não encontrado.");

              const store: WorkShiftStore = {
                async getOpenSession(userId) {
                  const row = (
                    await tx
                      .select({
                        id: workShiftSessions.id,
                        startedAt: workShiftSessions.startedAt,
                        pausedAt: workShiftSessions.pausedAt,
                        endedAt: workShiftSessions.endedAt,
                        status: workShiftSessions.status,
                        pausedSeconds: workShiftSessions.pausedSeconds,
                      })
                      .from(workShiftSessions)
                      .where(and(eq(workShiftSessions.userId, userId), inArray(workShiftSessions.status, ["active", "paused"])))
                      .orderBy(desc(workShiftSessions.startedAt))
                      .limit(1)
                  )[0];
                  if (!row) return null;
                  if (row.status !== "active" && row.status !== "paused") {
                    throw new Error("Estado aberto de jornada inválido.");
                  }
                  return { ...row, status: row.status };
                },
                async createSession(values) {
                  const [record] = await tx.insert(workShiftSessions).values(values).$returningId();
                  if (!record) throw new Error("Falha ao criar sessão de jornada.");
                  return { id: record.id };
                },
                async updateSession(sessionId, patch) {
                  await tx.update(workShiftSessions).set(patch).where(eq(workShiftSessions.id, sessionId));
                },
                async appendEvent(event) {
                  await tx.insert(workShiftEvents).values(event);
                },
                async mirrorTeam(teamId, patch) {
                  await tx.update(teams).set(patch).where(eq(teams.id, teamId));
                },
              };

              return executeOwnWorkShiftAction(store, input);
            });
          }

          '''
          source = source.replace(insert_marker, block + insert_marker, 1)
          path.write_text(source)
          PY

      - name: Validar contrato direcionado
        run: |
          corepack pnpm check
          corepack pnpm vitest run --config vitest.config.ts \
            server/workShiftDomain.test.ts \
            server/workShiftService.test.ts \
            server/workShiftDbContract.test.ts \
            server/teamShift.test.ts

      - name: Validar superfície do diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "server/db.ts"
          grep -q 'export async function controlOwnWorkShift' server/db.ts
          grep -q '\.for("update")' server/db.ts
          grep -q 'tx.insert(workShiftSessions)' server/db.ts
          grep -q 'tx.insert(workShiftEvents)' server/db.ts
          grep -q 'tx.update(teams)' server/db.ts

      - name: Versionar somente server/db.ts
        shell: bash
        run: |
          if git diff --quiet -- server/db.ts; then
            echo "Nenhuma alteração nova para versionar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/db.ts
          git commit -m "feat(d007): persist own work shift history transactionally"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
