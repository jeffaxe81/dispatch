name: D-007A coverage TEMP

on:
  push:
    branches:
      - feature/d007a-work-shift-history

permissions:
  contents: write

concurrency:
  group: d007a-coverage-temp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    name: Normalize router and regenerate tRPC inventory
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: true

    steps:
      - name: Obter branch da feature
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/d007a-work-shift-history

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências congeladas
        run: corepack pnpm install --frozen-lockfile

      - name: Normalizar bloco workShifts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("server/routers.ts")
          lines = path.read_text().splitlines(keepends=True)
          start_marker = "  workShifts: router({\n"
          end_marker = "  dashboard: router({\n"
          starts = [i for i, line in enumerate(lines) if line == start_marker]
          ends = [i for i, line in enumerate(lines) if line == end_marker]
          if len(starts) != 1 or len(ends) != 1 or starts[0] >= ends[0]:
              raise SystemExit("Marcadores workShifts/dashboard inesperados; patch recusado.")
          start = starts[0]
          end = ends[0]
          block = lines[start + 1:end]
          if not block or not block[0].startswith("  current:") or block[-1].strip() != "}),":
              raise SystemExit("Estrutura workShifts inesperada; patch recusado.")
          lines[start + 1:end] = ["  " + line for line in block]
          path.write_text("".join(lines))
          PY

      - name: Validar teste de inventário
        run: corepack pnpm vitest run --config vitest.config.ts server/trpcCoverageGenerator.test.ts

      - name: Regenerar documentação tRPC
        run: corepack pnpm contracts:coverage

      - name: Validar superfície do commit
        shell: bash
        run: |
          git diff --check
          printf '%s\n' docs/TRPC_CONTRACT_COVERAGE.md server/routers.ts | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Versionar somente router e inventário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers.ts docs/TRPC_CONTRACT_COVERAGE.md
          git commit -m "docs(d007): regenerate tRPC contract inventory"
          git push origin HEAD:feature/d007a-work-shift-history
