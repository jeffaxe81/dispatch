name: CP-016 Task 5 apply

on:
  push:
    branches:
      - feature/cp016-operational-data-model

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter branch CP-016
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/cp016-operational-data-model

      - name: Aplicar patch determinístico
        run: node scripts/cp016-task5-patch.mjs

      - name: Versionar integração
        run: |
          git add server/db.ts
          if git diff --cached --quiet; then
            echo "Task 5 já estava aplicada."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat: persist auditable work sessions"
            git push origin HEAD:feature/cp016-operational-data-model
          fi
