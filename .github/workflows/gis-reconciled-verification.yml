name: GIS reconciled verification

on:
  push:
    branches:
      - checkpoint/d005a-gis1-reconciled-20260903
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: gis-reconciled-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  verify:
    name: D-005A + GIS-1 quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências congeladas
        run: corepack pnpm install --frozen-lockfile

      - name: Verificar segurança
        run: corepack pnpm security:check

      - name: Verificar TypeScript
        run: corepack pnpm check

      - name: Executar testes GIS direcionados
        run: corepack pnpm vitest run --config vitest.config.ts client/src/components/LeafletOperationalMap.test.ts client/src/components/OperationalMap.test.ts server/routingProvider.test.ts server/gisService.test.ts

      - name: Executar suíte local completa
        run: corepack pnpm test

      - name: Gerar build
        run: corepack pnpm build
