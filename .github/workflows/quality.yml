name: Qualidade

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Instalação, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências congeladas
        run: corepack pnpm install --frozen-lockfile

      - name: Verificar segurança
        run: corepack pnpm security:check

      - name: Verificar TypeScript
        run: corepack pnpm check

      - name: Executar testes locais
        run: corepack pnpm test

      - name: Gerar build
        run: corepack pnpm build

      - name: Validar empacotamento Docker
        run: |
          cp .env.example .env
          export APP_PORT=13082
          cleanup() {
            docker compose down -v --remove-orphans >/dev/null 2>&1 || true
            rm -f .env
          }
          trap cleanup EXIT

          docker compose config > /dev/null
          docker compose build app migrate
          if ! docker compose up -d; then
            docker compose ps -a || true
            docker compose logs --no-color app migrate mysql || true
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:${APP_PORT}/health/live > /dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          docker compose ps -a || true
          docker compose logs --no-color app migrate mysql || true
          exit 1
