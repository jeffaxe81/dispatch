name: Shift handoff MySQL homologation
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: handoff-mysql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shift-handoff-mysql:
    name: Passagem de plantão MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dispatch_handoff_homologation
          MYSQL_USER: handoff_test
          MYSQL_PASSWORD: disposable-handoff-test-only
          MYSQL_ROOT_PASSWORD: disposable-handoff-root-test-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CI: "true"
      NODE_ENV: test
      AXE_RUNTIME_ENV: homologation
      AXE_HANDOFF_MYSQL_TESTS: "true"
      AXE_HANDOFF_MYSQL_TEST_DATABASE_URL: mysql://handoff_test:disposable-handoff-test-only@127.0.0.1:3306/dispatch_handoff_homologation
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Habilitar Corepack
        run: corepack enable
      - name: Instalar dependências congeladas
        run: corepack pnpm install --frozen-lockfile
      - name: Verificar TypeScript
        run: corepack pnpm check
      - name: Homologar passagem de plantão e isolamento em MySQL descartável
        run: corepack pnpm exec vitest run --config vitest.handoff-mysql.config.ts
      - name: Preservar evidências
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axed-f037-handoff-mysql
          path: artifacts/handoff-mysql
          if-no-files-found: warn
          retention-days: 14
