name: CP-016 validation

on:
  pull_request:
    branches:
      - integration/cp016-validation-base-20260903
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cp016-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  validate:
    name: CP-016 tests, typecheck, build and migration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependências congeladas
        run: corepack pnpm install --frozen-lockfile

      - name: Verificar segurança
        run: corepack pnpm security:check

      - name: Verificar TypeScript
        run: corepack pnpm check

      - name: Executar testes locais
        run: corepack pnpm test

      - name: Gerar build
        run: corepack pnpm build

      - name: Gerar migration Drizzle CP-016
        env:
          DATABASE_URL: mysql://cp016:cp016@127.0.0.1:3306/dispatch_cp016
        run: corepack pnpm exec drizzle-kit generate --config drizzle.config.ts

      - name: Publicar migration gerada para revisão
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cp016-drizzle-generation
          path: drizzle
          if-no-files-found: error
          retention-days: 7
