name: CP-016 CI

on:
  push:
    branches:
      - feature/cp-016-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CP-016 focused tests
        run: pnpm vitest run shared/operations.cp016.test.ts server/schema.cp016.test.ts

      - name: Typecheck
        run: pnpm check
