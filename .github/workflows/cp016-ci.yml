name: CP-016 CI

on:
  push:
    branches:
      - feature/cp-016-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dispatch_cp016
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/dispatch_cp016
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CP-016 focused tests
        run: pnpm vitest run shared/operations.cp016.test.ts server/schema.cp016.test.ts

      - name: Typecheck
        run: pnpm check

      - name: Generate CP-016 migration
        run: pnpm drizzle-kit generate

      - name: Reject destructive migration statements
        shell: bash
        run: |
          new_sql=$(git ls-files --others --exclude-standard 'drizzle/*.sql')
          if [ -z "$new_sql" ]; then
            echo "No generated SQL migration found"
            exit 1
          fi
          echo "Generated migration: $new_sql"
          if grep -Ein 'DROP[[:space:]]+(TABLE|COLUMN)|RENAME[[:space:]]+(TABLE|COLUMN)' $new_sql; then
            echo "Destructive SQL detected"
            exit 1
          fi

      - name: Apply migrations to ephemeral MySQL
        run: pnpm drizzle-kit migrate

      - name: Re-run focused tests after migration
        run: pnpm vitest run shared/operations.cp016.test.ts server/schema.cp016.test.ts

      - name: Upload generated migration evidence
        uses: actions/upload-artifact@v4
        with:
          name: cp016-generated-migration
          path: |
            drizzle/*.sql
            drizzle/meta/*.json
          if-no-files-found: error
