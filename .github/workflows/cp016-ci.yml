name: CP-016 CI

on:
  push:
    branches:
      - feature/cp-016-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dispatch_cp016
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/dispatch_cp016
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CP-016 focused tests
        run: pnpm vitest run shared/operations.cp016.test.ts server/schema.cp016.test.ts

      - name: Typecheck
        run: pnpm check

      - name: Generate CP-016 migration
        run: pnpm drizzle-kit generate

      - name: Reject destructive migration statements
        shell: bash
        run: |
          new_sql=$(git ls-files --others --exclude-standard 'drizzle/*.sql')
          if [ -z "$new_sql" ]; then
            echo "No generated SQL migration found"
            exit 1
          fi
          echo "Generated migration: $new_sql"
          if grep -Ein 'DROP[[:space:]]+(TABLE|COLUMN)|RENAME[[:space:]]+(TABLE|COLUMN)' $new_sql; then
            echo "Destructive SQL detected"
            exit 1
          fi

      - name: Upload generated migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp016-generated-migration
          path: |
            drizzle/*.sql
            drizzle/meta/*.json
          if-no-files-found: error

      - name: Diagnose SQL chain manually
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import mysql from 'mysql2/promise';

          const conn = await mysql.createConnection({ host: '127.0.0.1', port: 3306, user: 'root', password: 'root', multipleStatements: false });
          await conn.query('DROP DATABASE IF EXISTS dispatch_cp016_sql_debug');
          await conn.query('CREATE DATABASE dispatch_cp016_sql_debug');
          await conn.query('USE dispatch_cp016_sql_debug');

          const files = fs.readdirSync('drizzle')
            .filter(name => /^000[0-3]_.*\.sql$/.test(name))
            .sort()
            .map(name => path.join('drizzle', name));

          for (const file of files) {
            const sql = fs.readFileSync(file, 'utf8');
            const statements = sql.split('--> statement-breakpoint').map(s => s.trim()).filter(Boolean);
            console.log(`Applying ${file} (${statements.length} statements)`);
            for (let i = 0; i < statements.length; i++) {
              try {
                await conn.query(statements[i]);
              } catch (error) {
                console.error(`FAILED ${file} statement ${i + 1}/${statements.length}`);
                console.error(error.code, error.errno, error.sqlMessage);
                console.error(statements[i].slice(0, 1200));
                await conn.end();
                process.exit(1);
              }
            }
          }
          console.log('0000-0003 SQL chain applied successfully');
          await conn.end();
          NODE

      - name: Diagnose drizzle-orm migrator
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import mysql from 'mysql2/promise';
          import { drizzle } from 'drizzle-orm/mysql2';
          import { migrate } from 'drizzle-orm/mysql2/migrator';

          const admin = await mysql.createConnection({ host: '127.0.0.1', port: 3306, user: 'root', password: 'root' });
          await admin.query('DROP DATABASE IF EXISTS dispatch_cp016_orm_debug');
          await admin.query('CREATE DATABASE dispatch_cp016_orm_debug');
          await admin.end();

          const pool = mysql.createPool('mysql://root:root@127.0.0.1:3306/dispatch_cp016_orm_debug');
          const db = drizzle(pool);
          try {
            await migrate(db, { migrationsFolder: './drizzle' });
            console.log('drizzle-orm migrator succeeded');
          } catch (error) {
            console.error(error?.stack ?? error);
            process.exitCode = 1;
          } finally {
            await pool.end();
          }
          NODE

      - name: Apply migrations to ephemeral MySQL
        run: pnpm drizzle-kit migrate

      - name: Re-run focused tests after migration
        run: pnpm vitest run shared/operations.cp016.test.ts server/schema.cp016.test.ts
