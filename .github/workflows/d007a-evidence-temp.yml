name: D-007A evidence TEMP

on:
  push:
    branches:
      - feature/d007a-work-shift-history

permissions:
  contents: write

concurrency:
  group: d007a-evidence-temp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document:
    if: github.actor != 'github-actions[bot]'
    name: Record roadmap and D-007A evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ROADMAP_APPEND: |
        ## D-007 — Controle de Jornada de Trabalho

        - [x] D-007A — domínio histórico de sessão/eventos de jornada individual.
        - [x] D-007A — compatibilidade `teams.*shift*` sem alterar status operacional automaticamente.
        - [x] D-007A — `workShifts.current`, `workShifts.history` e `workShifts.control` com RBAC específico.
        - [x] D-007A — catálogo `work_shifts.view` e `work_shifts.control` sem grants automáticos.
        - [ ] D-007B — escalas fixas/cíclicas, 12x36, associações e exceções.
        - [ ] D-007C — elegibilidade por jornada antes do ranking GIS/despacho.
        - [ ] D-007D — ajustes, administração, relatórios e alertas.
      EVIDENCE: |
        # D-007A — Evidência da fundação histórica do controle de jornada

        **Data:** 2026-09-04  
        **Branch:** `feature/d007a-work-shift-history`  
        **PR:** #27 — draft  
        **Baseline de revisão:** `checkpoint/d006e-csp-frame-src-20260904` @ `e3bf9b4d5d7729f675b5c27122f79ea09f8efff1`  
        **SHA técnico validado antes deste registro documental:** `5a2adc84f9d2f8dcfea973671ff5f317c280f930`

        ## Escopo entregue

        A D-007A introduz a fundação histórica e auditável da jornada individual sem substituir, nesta fase, o cache legado de turno da equipe. Foram implementados domínio, persistência, serviço de orquestração, adapter transacional, API tRPC e RBAC específico.

        A API expõe `workShifts.current`, `workShifts.history` e `workShifts.control`. O endpoint de controle recebe somente a ação; `userId`, `teamId` e o instante efetivo da transição são definidos no servidor.

        ## Persistência e trilha histórica

        - `work_shift_sessions` preserva cada sessão de jornada, inclusive após encerramento.
        - `work_shift_events` registra os eventos de jornada com `before_data`, `after_data`, metadados e instante da ocorrência.
        - O caminho de domínio implementado é append-only para eventos: cada ação válida acrescenta exatamente um evento correspondente.
        - Snapshots de evento são serializáveis e usam datas ISO em vez de objetos `Date` crus.
        - A FK `work_shift_events.session_id → work_shift_sessions.id` usa `ON DELETE RESTRICT`, impedindo que a trilha seja removida por cascade da sessão.

        ## Concorrência e atomicidade

        `controlOwnWorkShift` executa dentro de `db.transaction` e adquire lock `FOR UPDATE` na linha do usuário antes de consultar/decidir a sessão aberta. A mesma transaction persiste sessão, evento e, quando aplicável, o espelho legado da equipe. A serialização por usuário evita que duas ações concorrentes de início sejam decididas simultaneamente no fluxo implementado.

        ## Máquina de estados

        O domínio cobre `start`, `pause`, `resume` e `end`, rejeita transições incompatíveis, acumula pausas e calcula o encerramento inclusive quando a jornada é finalizada durante uma pausa. Sessões encerradas permanecem históricas e uma jornada futura cria nova sessão.

        ## Compatibilidade com o legado

        O espelho `teams.*shift*` é mantido somente quando a sessão possui `teamId`. A nova jornada não altera `teams.status`. O endpoint legado `teams.updateShift` e suas regras permanecem cobertos pela suíte de regressão.

        ## RBAC

        Foram catalogadas apenas as permissões `work_shifts.view` e `work_shifts.control`. A migration não cria grants em `role_permissions`. Perfis dinâmicos precisam receber a permissão explicitamente; agente legado não recebe `work_shifts.control` implicitamente. O administrador legado permanece compatível por wildcard `*`.

        ## Migration — revisão destrutiva

        A migration `drizzle/0003_d007a_work_shift_history.sql` foi gerada e revisada, mas não foi aplicada. A revisão confirmou:

        - criação apenas de `work_shift_sessions`, `work_shift_events`, índices, FKs e catálogo das duas permissões D-007A;
        - ausência de `DROP TABLE`, `DROP COLUMN` e outras operações destrutivas;
        - ausência de inserções em `role_permissions`;
        - ausência de dados operacionais reais;
        - `ON DELETE RESTRICT` na relação evento → sessão;
        - coerência com `drizzle/workShiftSchema.ts`, `drizzle/meta/0003_snapshot.json` e `drizzle/meta/_journal.json`.

        ## Inventário tRPC e regressão

        O inventário foi reconciliado para **104 procedimentos tRPC**. Além dos três contratos de jornada, a contagem atual inclui dois contratos de aplicações incorporadas e dois contratos GIS que haviam sido acrescentados depois do inventário anterior.

        A execução oficial **Qualidade #165** associada ao head `5a2adc84f9d2f8dcfea973671ff5f317c280f930` aprovou segurança, TypeScript, suíte completa e build. Resultado real da suíte: **91 arquivos / 402 testes**, todos aprovados. A suíte completa inclui e aprovou individualmente `workShiftDomain`, `workShiftSchema`, `workShiftService`, `workShiftDbContract`, `workShifts.router`, `teamShift`, `triageAndShift.router` e `accessControl`.

        Gates no mesmo SHA técnico:

        - Qualidade #165 — run `33910882711` — success;
        - GIS visual #160 — run `33910882705` — success;
        - NEO external compatibility #97 — run `33910882713` — success;
        - NEO workspace visual #140 — run `33910882686` — success.

        O comando direcionado da Task 7.1 não foi executado localmente porque o ambiente local disponível não possuía resolução DNS para clonar o GitHub. A evidência usada é a suíte completa oficial da Qualidade #165, que é um superset e registra cada suíte D-007A acima como aprovada.

        ## Escopo explicitamente adiado

        - **D-007B:** escalas fixas/cíclicas, 12x36, associações, exceções, timezone e âncora de ciclo.
        - **D-007C:** elegibilidade por jornada antes do ranking GIS/despacho, incluindo motivos `outside_shift` e `shift_paused`.
        - **D-007D:** ajustes, aprovação/rejeição, administração, relatórios, exportações e alertas.

        ## Declaração operacional

        Até este registro, a migration foi somente gerada e revisada. **Não houve `db:push`, aplicação da migration em banco real, merge em `main` ou deploy.** Como este documento altera o SHA da branch, os quatro gates normais devem ser repetidos no head documental antes da criação do checkpoint imutável D-007A.

    steps:
      - name: Obter branch da feature
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/d007a-work-shift-history

      - name: Registrar roadmap e evidência sem regravar conteúdo existente
        shell: bash
        run: |
          python3 -c 'import os; from pathlib import Path; p=Path("todo.md"); s=p.read_text(); marker="## D-007 — Controle de Jornada de Trabalho"; assert marker not in s, "Seção D-007 já existe; patch recusado."; e=Path("docs/D-007A-WORK-SHIFT-HISTORY-EVIDENCE.md"); assert not e.exists(), "Documento de evidência já existe; patch recusado."; p.write_text(s.rstrip()+"\n\n\n"+os.environ["ROADMAP_APPEND"].rstrip()+"\n"); e.write_text(os.environ["EVIDENCE"].rstrip()+"\n")'

      - name: Validar superfície documental
        shell: bash
        run: |
          git diff --check
          printf '%s\n' docs/D-007A-WORK-SHIFT-HISTORY-EVIDENCE.md todo.md | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual

      - name: Versionar somente roadmap e evidência
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add todo.md docs/D-007A-WORK-SHIFT-HISTORY-EVIDENCE.md
          git commit -m "docs(d007): record D-007A historical shift evidence"
          git push origin HEAD:feature/d007a-work-shift-history
